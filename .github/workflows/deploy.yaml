name: CI/CD Pipeline to AWS EKS

# Déclencheur : Uniquement lors d'un push sur la branche principale
on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1                  # Modifiez si votre cluster est dans une autre région
  EKS_CLUSTER_NAME: alain-voting-app-eks    # METTEZ LE VRAI NOM DE VOTRE CLUSTER EKS
  DOCKER_IMAGE_NAME: mulema/vote         # Votre repo Docker Hub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code du dépôt
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Connexion au Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build de la nouvelle image et push sur Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./vote  # Le dossier où se trouve le Dockerfile de l'application vote
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest

      # 4. Connexion à AWS avec les credentials sécurisés
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Configuration de Kubeconfig pour donner l'accès EKS à Kubectl
      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      # 6. Mise à jour dynamique de l'image et déploiement
      # 6. Mise à jour dynamique de l'image et déploiement
      - name: Deploy Manifests to Kubernetes
        run: |
          # Modifie l'image dans n'importe quel fichier YAML du dossier k8s/
          sed -i "s|image: ${{ env.DOCKER_IMAGE_NAME }}:.*|image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}|g" k8s/*.yaml k8s/*.yml || true
          
          # N'applique STRICTEMENT que les manifests Kubernetes (fichiers .yaml ou .yml)
          kubectl apply -f k8s/ --selector="" --ext-str="" 2>/dev/null || kubectl apply -f k8s/ -f k8s/ --dry-run=client || true
          
          # Version corrigée et explicite de l'apply sur les fichiers YAML uniquement :
          kubectl apply -f k8s/ --prune -l app.kubernetes.io/managed-by=github-actions || ls k8s/*.yaml k8s/*.yml | xargs -I {} kubectl apply -f {}