apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: alain-voting-app-eks
  region: us-east-1
  version: "1.34"

vpc:
  cidr: "10.0.0.0/16"
  nat:
    gateway: HighlyAvailable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# 🚀 C'est ICI : Toutes les configurations d'identités (OIDC et Pod Identity custom) vont dans le bloc iam
iam:
  withOIDC: true
  podIdentityAssociations:
    - serviceAccountName: app-s3-sa
      namespace: default
      roleARN: arn:aws:iam::686699774218:role/alain-eks-role

managedNodeGroups:
  - name: workers-apps
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 30
    privateNetworking: true

addons:
  - name: vpc-cni            
  - name: kube-proxy
  - name: eks-pod-identity-agent
  
  - name: aws-ebs-csi-driver
    podIdentityAssociations:
      - serviceAccountName: ebs-csi-controller-sa
        namespace: kube-system
        roleARN: arn:aws:iam::686699774218:role/alain-eks-role

  